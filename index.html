<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Списки мовою HTML</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1d2433;--m:#5d6679;--a:#3563e9;--ok:#1a8f4c;--no:#d23b3b;--b:#d9deea}
@media(prefers-color-scheme:dark){:root{--bg:#161a24;--c:#202636;--t:#e9edf6;--m:#9aa3b8;--a:#7a9dff;--ok:#4cc382;--no:#ff7676;--b:#38405a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}.m{color:var(--m);font-size:14px}
input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:8px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row input{flex:1;min-width:120px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--a);color:#fff}
button.s{background:var(--b);color:var(--t)}button:disabled{opacity:.5;cursor:default}
code,pre{font-family:Consolas,monospace}pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;margin:6px 0}
.q{margin:0 0 14px}.o{display:block;padding:5px 8px;border-radius:8px;cursor:pointer}.o.ok{background:rgba(26,143,76,.18)}.o.no{background:rgba(210,59,59,.18)}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--a)}
.ln{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:4px 8px;margin:4px 0;cursor:grab}
.ln code{flex:1}.ln button{padding:2px 9px;background:var(--b);color:var(--t)}.ln.ok{border-color:var(--ok)}.ln.no{border-color:var(--no)}
textarea{width:100%;height:170px;font-family:Consolas,monospace}iframe{width:100%;height:190px;border:1px dashed var(--b);border-radius:8px;background:#fff}
.f{margin-top:10px;font-size:15px}.g{color:var(--ok)}.r{color:var(--no)}table{border-collapse:collapse;width:100%}td{padding:6px;border-bottom:1px solid var(--b)}
.pvw{background:#fff;color:#111;border:1px dashed var(--b);border-radius:8px;padding:4px 10px;margin:6px 0 12px}
.mt{position:relative;display:flex;justify-content:space-between;gap:70px;margin-top:12px}.col{display:flex;flex-direction:column;gap:14px;flex:1;z-index:1}.nd{border:2px solid var(--b);background:var(--bg);border-radius:10px;padding:10px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;text-align:center}.nd.on{border-color:var(--a)}.nd.ok{border-color:var(--ok)}.nd.no{border-color:var(--no)}#sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}@media(max-width:520px){.mt{gap:40px}.nd{padding:8px 4px;font-size:14px}}
.cl{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:5px 10px;margin:3px 0;cursor:pointer}.cl code{white-space:pre;flex:1;overflow-x:auto}.cl .n{color:var(--m);width:20px;text-align:right;font-size:13px}.cl.ok{border-color:var(--ok);background:rgba(26,143,76,.15)}.cl.no{border-color:var(--no);background:rgba(210,59,59,.12)}.ex{font-size:14px;margin:0 0 6px 40px}#hp{font-size:20px;margin:8px 0}
</style></head><body><main id="m"></main>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby5JuoBDhkyMaeFKb3bjrhbHsIZIhM4f741IKFEZzoxtfYlNnycEXdbmtxjUtl1QQYyRw/exec",KEY="змініть-на-свій-ключ",TASK="Списки мовою HTML";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ME={sn:"",fn:"",cl:""},NM=["Тест","Відповідність тегів","Складання коду","Практика: власний список","Полювання на жучків"],MX=[6,4,2,4,4],S=[0,0,0,0,0],ERR=[],ATT=[0,0,0,0,0];
let st=-1,done=false,LN=[];const Q=[
{q:"Який тег створює маркований список (unordered list)?",o:["<ul>","<ol>","<dl>","<li>"],a:0},
{q:"Який тег позначає ТЕРМІН у списку визначень (description list)?",o:["<dd>","<dt>","<li>","<dl>"],a:1},
{q:"Який запис вкладеного списку є правильним?",o:["<ul><li>A</li><li><ul>B</ul></li></ul>","<ul><li>A<ul><li>B</li></ul></li></ul>","<ul><li>A</li></ul><ul><li>B</li></ul>","<li><ul>A</ul></li>"],a:1},
{q:"Який запис задає нумерацію великими літерами A, B, C?",o:["<ol type=\"A\">","<ol type=\"a\">","<ol type=\"1\">","<ul type=\"A\">"],a:0},
{q:"Який запис задає нумерацію римськими цифрами I, II, III?",o:["<ol type=\"roman\">","<ol type=\"R\">","<ol type=\"I\">","<ol type=\"i\" start=\"0\">"],a:2},
{q:"Який тип позначки (marker) має маркований список <ul> верхнього рівня за замовчуванням?",o:["disc (круглий заповнений маркер)","circle (порожнє коло)","square (квадрат)","none (без позначки)"],a:0}];
const PR=[["<ul>",0],["<ol>",1],["<li>",2],["<dl>",3]],PO=["маркований список","нумерований список","пункт (елемент) списку","список термінів і визначень","опис терміна у списку визначень","багаторівневий список"];
const CODE=["<ol>","<li>Фронтенд","<ul>","<li>HTML</li>","<li>CSS</li>","</ul>","</li>","<li>Бекенд</li>","</ol>"];
function shuf(a){a=a.slice();do{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}while(a.every((x,i)=>x==CODE[i]));return a}
const bar=()=>`<div class="bar"><i style="width:${Math.max(0,st)/5*100}%"></i></div>`;
function R(){const m=$("#m");done=false;
if(st<0){m.innerHTML=`<div class="card"><h1>Списки мовою HTML</h1><div class="m">Курс «Веб-технології та веб-дизайн», 11 клас. ${NM.length} завдань, максимум ${MX.reduce((a,b)=>a+b)} балів.</div>
<p style="margin:12px 0 4px"><b>Що перевіряється й оцінюється:</b> знання тегів і атрибутів для створення списків у HTML (маркованих, нумерованих, вкладених, списків визначень), уміння писати код списків та знаходити в ньому помилки.</p>
<table>${["знання тегів, атрибутів і типів позначок списків","відповідність тегів їх призначенню","правильна послідовність рядків коду вкладеного списку","написання коду трирівневого списку з потрібними типами нумерації й маркерів","пошук і розпізнавання помилок у коді списків"].map((d,i)=>`<tr><td><b>${i+1}. ${NM[i]}</b><br><span class="m">${d}</span></td><td style="white-space:nowrap;text-align:right">${MX[i]} б.</td></tr>`).join("")}</table>
<div class="m" style="margin:6px 0 10px">Завдання 1–3 перевіряються з однієї спроби, у завданні 4 є до 3 спроб, у завданні 5 — три життя. Після кожної перевірки ви побачите кількість помилок, а наприкінці — підсумок, який можна надіслати вчителю.</div>
<div class="row"><input id="sn" placeholder="Прізвище" value="${esc(ME.sn)}"><input id="fn" placeholder="Ім'я" value="${esc(ME.fn)}"><input id="cl" placeholder="Клас" value="${esc(ME.cl)}"></div>
<button onclick="go()">Почати</button> <span id="e" class="r"></span></div>`;return}
if(st==5){sum();return}
m.innerHTML=`${bar()}<div class="card"><h2>Завдання ${st+1}/5: ${NM[st]}</h2><div id="b"></div><div class="f" id="f"></div><div class="row"><button id="ck" onclick="chk()">Перевірити</button><button id="nx" class="s" style="display:none" onclick="st++;R()">Далі →</button></div></div>`;
[t1,t2,t3,t4,t5][st]()}
function go(){ME.sn=$("#sn").value;ME.fn=$("#fn").value;ME.cl=$("#cl").value;
if(!ME.sn.trim()||!ME.fn.trim()||!ME.cl.trim()){$("#e").textContent="Заповніть прізвище, ім'я та клас.";return}
try{fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",keepalive:true,body:JSON.stringify({key:KEY,task:"Реєстрація",fields:{"ПІБ учня":(ME.sn.trim()+" "+ME.fn.trim()).trim(),"Клас":ME.cl.trim(),"Назва проєкту":TASK}})}).catch(()=>{})}catch(x){}
st=0;R()}
function chk(){if(done)return;[c1,c2,c3,c4,c5][st]()}
const PRZ=["Чудово! Жодної помилки — так тримати! 🎉","Бездоганно! Ви чудово знаєте списки HTML! 🌟","Відмінна робота! Усе правильно! 👏"],MOT=["Нічого страшного: помилки допомагають вчитися. Наступного разу вийде краще! 💪","Не засмучуйтесь — кожна помилка наближає до майстерності. Ви на правильному шляху! 🚀","Не зупиняйтесь — у вас обов'язково вийде! 🙂"],RETRY=["У вас ще є спроби! Уважно перечитайте умову, виправте код і перевірте ще раз. 💪","Не здавайтесь — виправте код і перевірте знову, у вас усе вийде! 🚀"];
const pk=a=>a[Math.random()*a.length|0];
function mot(err,retry){return `<div style="margin-top:8px" class="${err?"":"g"}"><b>${pk(!err?PRZ:retry?RETRY:MOT)}</b></div>`}
function fin(i,p,errs,msg){ATT[i]++;if(i<3||p==MX[i]||ATT[i]>=3){done=true;S[i]=Math.max(S[i],p);errs.forEach(e=>ERR.push(NM[i]+": "+e));$("#ck").style.display="none";$("#nx").style.display="";$("#nx").textContent="Далі →"}
else{errs.forEach(e=>ERR.push(NM[i]+" (спроба "+ATT[i]+"): "+e));S[i]=Math.max(S[i],p)}
$("#f").innerHTML=msg+mot(p<MX[i],i==3&&!done)}
function t1(){$("#b").innerHTML=Q.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="o" id="o${i}_${j}"><input type="radio" name="q${i}" value="${j}"> <code>${esc(o)}</code></label>`).join("")}</div>`).join("")}
function c1(){let p=0,er=[];Q.forEach((q,i)=>{const v=document.querySelector(`input[name=q${i}]:checked`);const ok=v&&+v.value==q.a;if(ok)p++;else er.push("питання "+(i+1))});document.querySelectorAll("#b input").forEach(x=>x.disabled=true);
fin(0,p,er,`Кількість помилок: <b>${Q.length-p}</b>`)}
let RO=[],cn={},sel=null,dg=null,ck2=false;
const ln=(a,b,c)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="${a[0]}" cy="${a[1]}" r="5" fill="${c}"/><circle cx="${b[0]}" cy="${b[1]}" r="5" fill="${c}"/>`;
function con(l,r){for(const k in cn)if(cn[k]==r)delete cn[k];cn[l]=r}
function cl2(s,i){if(sel&&sel.s!=s){con(s=="l"?i:sel.i,s=="r"?i:sel.i);sel=null}else if(sel&&sel.s==s&&sel.i==i)sel=null;else if(!sel&&(s=="l"?cn[i]!==undefined:Object.values(cn).includes(i))){if(s=="l")delete cn[i];else for(const k in cn)if(cn[k]==i)delete cn[k]}else sel={s,i}}
function dr2(){const mt=$("#mt");if(!mt)return;const R=mt.getBoundingClientRect();let h="";
const nd=(s,i)=>mt.querySelector(`.nd[data-s="${s}"][data-i="${i}"]`),pt=(n,side)=>{const b=n.getBoundingClientRect();return[(side=="r"?b.right:b.left)-R.left,b.top+b.height/2-R.top]};
mt.querySelectorAll(".nd").forEach(n=>{n.classList.toggle("on",!!sel&&sel.s==n.dataset.s&&sel.i==+n.dataset.i);n.classList.remove("ok","no")});
for(const k in cn){const a=pt(nd("l",k),"r"),b=pt(nd("r",cn[k]),"l"),ok=PR[k][1]==cn[k];let c="var(--a)";if(ck2){c=ok?"var(--ok)":"var(--no)";nd("l",k).classList.add(ok?"ok":"no");nd("r",cn[k]).classList.add(ok?"ok":"no")}h+=ln(a,b,c)}
if(dg){const a=pt(nd(dg.s,dg.i),dg.s=="l"?"r":"l");h+=ln(a,[dg.px-R.left,dg.py-R.top],"var(--a)")}
$("#sv").innerHTML=h}
function t2(){RO=[0,1,2,3,4,5].sort(()=>Math.random()-.5);cn={};sel=null;dg=null;ck2=false;
$("#b").innerHTML=`<div class="m">З'єднайте лінією кожен тег із його призначенням: потягніть від тега до призначення (або натисніть на тег, а потім на призначення). Натисніть на з'єднаний елемент, щоб прибрати лінію.</div><div id="mt" class="mt"><svg id="sv"></svg><div class="col">${PR.map((x,i)=>`<div class="nd" data-s="l" data-i="${i}"><code>${esc(x[0])}</code></div>`).join("")}</div><div class="col">${RO.map(j=>`<div class="nd" data-s="r" data-i="${j}">${PO[j]}</div>`).join("")}</div></div>`;
const mt=$("#mt");
mt.onpointerdown=e=>{const n=e.target.closest(".nd");if(!n||done)return;e.preventDefault();dg={s:n.dataset.s,i:+n.dataset.i,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,mv:false}};
mt.onpointermove=e=>{if(!dg)return;if(Math.abs(e.clientX-dg.x)+Math.abs(e.clientY-dg.y)>8)dg.mv=true;dg.px=e.clientX;dg.py=e.clientY;dr2()};
mt.onpointerup=e=>{if(!dg)return;const g=dg;dg=null;const n=document.elementFromPoint(e.clientX,e.clientY),t=n&&n.closest(".nd");
if(g.mv&&t&&t.dataset.s!=g.s){con(g.s=="l"?g.i:+t.dataset.i,g.s=="r"?g.i:+t.dataset.i);sel=null}else if(!g.mv||(t&&t.dataset.s==g.s&&+t.dataset.i==g.i))cl2(g.s,g.i);dr2()};
mt.onpointercancel=mt.onpointerleave=()=>{if(dg){dg=null;dr2()}};dr2()}
function c2(){let p=0,er=[];PR.forEach((x,i)=>{if(cn[i]===x[1])p++;else er.push("тег "+x[0])});sel=null;dr2();
fin(1,p,er,`Кількість помилок: <b>${4-p}</b>`)}
